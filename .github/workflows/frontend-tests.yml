name: Frontend Tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate environment
        run: npm run make:requirements

      - name: Run tests
        run: npm run test -- --testPathIgnorePatterns="terms-of-use.component.spec.ts|documentation.component.spec.ts|privacy-policy.component.spec.ts|recommendations.service.spec.ts|redirect.service.spec.ts|config.service.spec.ts|recommendations.component.spec.ts|back-to-search-bar.component.spec.ts|test.ts"
