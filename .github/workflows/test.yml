name: Test

on: push

jobs:
  backend:
    runs-on: self-hosted
    container:
      image: python:3.10
    services:
      db_test:
        image: postgres:14
        env:
          POSTGRES_DB: ess_test
          POSTGRES_USER: ess_test
          POSTGRES_PASSWORD: ess_test
        options: >-
          --health-cmd "pg_isready -U ess_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URI: postgresql+psycopg2://ess_test:ess_test@db_test:5432/ess_test
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pipenv'
        cache-dependency-path: backend/Pipfile.lock
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y build-essential libpq-dev python3-dev libxml2-dev libxslt1-dev zlib1g-dev
    - name: Install pipenv
      run: python -m pip install --upgrade pip pipenv
    - name: Install dependencies
      run: pipenv sync --dev
      working-directory: ./backend
    - name: Run tests
      run: ENVIRONMENT=test pipenv run pytest -m "not integration"
      working-directory: ./backend
      env:
        TESTING: 1
  backend-integration:
    runs-on: self-hosted
    needs: backend
    container:
      image: python:3.10
    services:
      db_test:
        image: postgres:14
        env:
          POSTGRES_DB: ess_test
          POSTGRES_USER: ess_test
          POSTGRES_PASSWORD: ess_test
        options: >-
          --health-cmd "pg_isready -U ess_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      zoo1_test:
        image: zookeeper:3.7
        env:
          ZOO_4LW_COMMANDS_WHITELIST: mntr, conf, ruok
      solr1_test:
        image: solr:8.11
        env:
          ZK_HOST: zoo1_test:2181
        options: >-
          -v "${{ github.workspace }}/solr/config/configsets:/configsets"
          -v "${{ github.workspace }}/solr/config:/app/solr-config"
          -v "${{ github.workspace }}/solr/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d"
          --entrypoint bash
          solr
          -lc "cp /app/solr-config/solr.xml /opt/solr/server/solr/solr.xml && exec docker-entrypoint.sh solr -f"
      rabbitmq:
        image: itzg/rabbitmq-stomp:latest
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
    env:
      TEST_DATABASE_URI: postgresql+psycopg2://ess_test:ess_test@db_test:5432/ess_test
      SOLR_URL: http://solr1_test:8983/solr/
      TEST_SOLR_URL: http://solr1_test:8983/solr/
      STOMP_HOST: rabbitmq
      STOMP_PORT: "61613"
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pipenv'
        cache-dependency-path: backend/Pipfile.lock
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y build-essential libpq-dev python3-dev libxml2-dev libxslt1-dev zlib1g-dev
    - name: Install pipenv
      run: python -m pip install --upgrade pip pipenv
    - name: Install dependencies
      run: pipenv sync --dev
      working-directory: ./backend
    - name: Wait for SOLR
      run: |
        timeout 500 bash -c "while [[ \"$(curl -s -o /dev/null -w '%{http_code}' \"$SOLR_URL\")\" != \"200\" ]]; do sleep 5; done" || false
    - name: Run tests
      run: ENVIRONMENT=test pipenv run pytest -m "integration"
      working-directory: ./backend
      env:
        TESTING: 1
