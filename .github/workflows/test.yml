name: Test

on: push

jobs:
  backend:
    runs-on: self-hosted
    env:
      COMPOSE_PROJECT_NAME: backend-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v3
    - name: Start containers
      run: docker compose -f dc-test.yml up -d db_test
    - name: Export database URI
      run: |
        DB_PORT=$(docker compose -f dc-test.yml port db_test 5432 | awk -F: '{print $NF}')
        echo "TEST_DATABASE_URI=postgresql+psycopg2://ess_test:ess_test@127.0.0.1:${DB_PORT}/ess_test" >> "$GITHUB_ENV"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pipenv'
        cache-dependency-path: backend/Pipfile.lock
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpq-dev python3-dev libxml2-dev libxslt1-dev zlib1g-dev
    - name: Install pipenv
      run: python -m pip install --upgrade pip pipenv
    - name: Install dependencies
      run: pipenv sync --dev
      working-directory: ./backend
    - name: Run tests
      run: ENVIRONMENT=test pipenv run pytest -m "not integration"
      working-directory: ./backend
      env:
        TESTING: 1
    - name: Containers logs
      if: always()
      run: docker compose -f dc-test.yml logs
    - name: Stop containers
      if: always()
      run: docker compose -f dc-test.yml down
  backend-integration:
    runs-on: self-hosted
    env:
      COMPOSE_PROJECT_NAME: backend-int-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v3
    - name: Start containers
      run: docker compose -f dc-test.yml up -d
    - name: Export service endpoints
      run: |
        DB_PORT=$(docker compose -f dc-test.yml port db_test 5432 | awk -F: '{print $NF}')
        SOLR_PORT=$(docker compose -f dc-test.yml port solr1_test 8983 | awk -F: '{print $NF}')
        STOMP_PORT=$(docker compose -f dc-test.yml port rabbitmq 61613 | awk -F: '{print $NF}')
        echo "TEST_DATABASE_URI=postgresql+psycopg2://ess_test:ess_test@127.0.0.1:${DB_PORT}/ess_test" >> "$GITHUB_ENV"
        echo "SOLR_URL=http://127.0.0.1:${SOLR_PORT}/solr/" >> "$GITHUB_ENV"
        echo "TEST_SOLR_URL=http://127.0.0.1:${SOLR_PORT}/solr/" >> "$GITHUB_ENV"
        echo "STOMP_HOST=127.0.0.1" >> "$GITHUB_ENV"
        echo "STOMP_PORT=${STOMP_PORT}" >> "$GITHUB_ENV"
        echo "TEST_STOMP_HOST=127.0.0.1" >> "$GITHUB_ENV"
        echo "TEST_STOMP_PORT=${STOMP_PORT}" >> "$GITHUB_ENV"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pipenv'
        cache-dependency-path: backend/Pipfile.lock
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpq-dev python3-dev libxml2-dev libxslt1-dev zlib1g-dev
    - name: Install pipenv
      run: python -m pip install --upgrade pip pipenv
    - name: Install dependencies
      run: pipenv sync --dev
      working-directory: ./backend
    - name: Wait for SOLR
      run: |
        timeout 500 bash -c "while [[ \"$(curl -s -o /dev/null -w '%{http_code}' \"$SOLR_URL\")\" != \"200\" ]]; do sleep 5; done" || false
    - name: Run tests
      run: ENVIRONMENT=test pipenv run pytest -m "integration"
      working-directory: ./backend
      env:
        TESTING: 1
    - name: Containers logs
      if: always()
      run: docker compose -f dc-test.yml logs
    - name: Stop containers
      if: always()
      run: docker compose -f dc-test.yml down
