name: Test

on: push

jobs:
  backend:
    runs-on: self-hosted
    container:
      image: python:3.10
    services:
      db_test:
        image: postgres:14
        env:
          POSTGRES_DB: ess_test
          POSTGRES_USER: ess_test
          POSTGRES_PASSWORD: ess_test
        options: >-
          --health-cmd "pg_isready -U ess_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URI: postgresql+psycopg2://ess_test:ess_test@db_test:5432/ess_test
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pipenv'
        cache-dependency-path: backend/Pipfile.lock
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y build-essential libpq-dev python3-dev libxml2-dev libxslt1-dev zlib1g-dev
    - name: Install pipenv
      run: python -m pip install --upgrade pip pipenv
    - name: Install dependencies
      run: python -m pipenv sync --dev
      working-directory: ./backend
    - name: Run tests
      run: ENVIRONMENT=test python -m pipenv run pytest -m "not integration"
      working-directory: ./backend

  backend-integration:
    runs-on: self-hosted
    env:
      COMPOSE_PROJECT_NAME: backend-int-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v3
    - name: Start containers
      run: docker compose -f dc-test.yml up -d
    - name: Get container network
      id: network
      run: |
        NETWORK=$(docker inspect $(docker compose -f dc-test.yml ps -q db_test) --format='{{range .NetworkSettings.Networks}}{{.NetworkName}}{{end}}')
        echo "network=$NETWORK" >> $GITHUB_OUTPUT
    - name: Run tests in container
      run: |
        docker run --rm \
          --network ${{ steps.network.outputs.network }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/backend \
          -e ENVIRONMENT=test \
          -e TEST_DATABASE_URI=postgresql+psycopg2://ess_test:ess_test@db_test:5432/ess_test \
          -e SOLR_URL=http://solr1_test:8983/solr/ \
          -e TEST_SOLR_URL=http://solr1_test:8983/solr/ \
          -e STOMP_HOST=rabbitmq \
          -e STOMP_PORT=61613 \
          -e TEST_STOMP_HOST=rabbitmq \
          -e TEST_STOMP_PORT=61613 \
          python:3.10 bash -c "
            apt-get update && apt-get install -y build-essential libpq-dev python3-dev libxml2-dev libxslt1-dev zlib1g-dev curl &&
            python -m pip install --upgrade pip pipenv &&
            python -m pipenv sync --dev &&
            timeout 500 bash -c 'while [[ \"\$(curl -s -o /dev/null -w \"%{http_code}\" http://solr1_test:8983/solr/admin/info/system)\" != \"200\" ]]; do echo \"Waiting for Solr...\"; sleep 5; done' || false &&
            python -m pipenv run pytest -m integration
          "
    - name: Containers logs
      if: always()
      run: docker compose -f dc-test.yml logs
    - name: Stop containers
      if: always()
      run: docker compose -f dc-test.yml down
